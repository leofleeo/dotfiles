# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

#format = '''
#$golang$rust$java$nodejs$python $directory $character
#'''

format = """
[ ](red)\
$os\
[ ](fg:red bg:peach)\
$username\
[ ](fg:peach bg:yellow)\
$directory\
[ ](fg:yellow bg:green)\
$git_branch\
[ ](fg:green bg:sapphire)\
$python\
$nodejs\
$golang\
$rust\
$java\
$dart\
[ ](fg:sapphire)
"""

palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"


# Replace the '❯' symbol in the prompt with '➜'
#[character] # The name of the module we are configuring is 'character'
#success_symbol = '[➜](bold green)' # The 'success_symbol' segment is being set to '➜' with the color 'bold green'

# Disable the package module, hiding it from the prompt completely
#

[username]
show_always = true
style_user = "bg:peach fg:base"
style_root = "bg:peach fg:base"
format = "[$user ]($style)"
disabled = false

[directory]
style = "bg:yellow fg:base"
format = "[$path ]($style)"

[package]
disabled = true

[os]
disabled = false
style = "bg:red fg:base"

[os.symbols]
openSUSE = " "
SUSE = " "
Ubuntu = " "

[git_branch]
symbol = " "
style = "bg:green fg:base"
format = "[$symbol$branch ]($style)"

[golang]
symbol = " "
format = "[$symbol$version ]($style)"
style = "bg:sapphire fg:base"

[python]
symbol = "󰌠 "
format = "[$symbol$version ]($style)"
style = "bg:sapphire fg:base"

[java]
symbol = "󰬷 "
style = "bg:sapphire fg:base"
format = "[$symbol$version ]($style)"

[rust]
symbol = " "
style = "bg:sapphire fg:base"
format = "[$symbol$version ]($style)"

[nodejs]
format = "[$symbol$version ]($style)"
style = "bg:sapphire fg:base"

[dart]
symbol = " "
style = "bg:sapphire fg:base"
format = "[$symbol$version ]($style)"

#[character]
#success_symbol = "[❯](green)"
#error_symbol = "[❯](red)"
