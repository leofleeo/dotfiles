# BACKGROUND
background {
    monitor =
    #path = screenshot
    path = /home/devcat/Pictures/wallpapers/candymoniumnight.jpg
    #color = $background
    blur_passes = 2
    contrast = 1
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# GENERAL
general {
    no_fade_in = true
    no_fade_out = true
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.35 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgb(198, 160, 246) # catppuccin mocha mauve
    inner_color = rgba(36, 39, 58, 0.6) #catppuccin mocha base
    font_color = rgb(205, 214, 244) # catppuccin mocha text
    fade_on_empty = false
    rounding = -1
    check_color = rgb(204, 136, 34)
    placeholder_text = <i><span foreground="##cdd6f4">Input Password...</span></i>
    hide_input = false
    position = 0, -100
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = cmd[update:1000] date +"%-I:%M %p"
    font_size = 95
    font_family = Inter Bold
    position = 0,150
    halign=center
    valign=center
    color = rgb(205, 214, 244) # catppuccin mocha text
}

# DATE
label {
    monitor =
    text = cmd[update:1000] date +"%A, %B %d"
    font_size = 25
    font_family = Inter Bold
    position = 0, 50
    halign = center
    valign = center
    color = rgb(205, 214, 244) # catppuccin mocha text
}
